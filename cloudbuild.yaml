# Continuous delivery for the existing Cloud Run service.
#
# The bootstrap script creates the service, its runtime identity, secrets and
# supporting Google Cloud resources. A repository trigger then uses this file
# for every ordinary release: test one commit, build one immutable image, probe
# that exact revision at zero traffic, and promote it only when it answers.

substitutions:
  _REGION: europe-west1
  _REPOSITORY: cloud-run-source-deploy
  _SERVICE: omnichannel-booking-assistant
  _ALTEGIO_PARTNER_SECRET: altegio-app2555-partner-token
  _ALTEGIO_USER_SECRET: altegio-app2555-user-token

steps:
  - id: test
    name: golang:1.27
    entrypoint: bash
    args:
      - -ceu
      - |
        unformatted="$$(gofmt -l .)"
        if [[ -n "$$unformatted" ]]; then
          echo "These files are not gofmt-formatted:"
          echo "$$unformatted"
          exit 1
        fi
        go vet ./...
        go test ./... -race -count=1
        go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - VERSION=$SHORT_SHA
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$COMMIT_SHA
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$COMMIT_SHA

  - id: deploy-candidate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$COMMIT_SHA
      - --region=${_REGION}
      - --no-traffic
      - --tag=candidate-$SHORT_SHA
      # Authorized replacement AI assistant app 2555. Pin the credential pair so an old
      # revision keeps its original credentials if traffic is rolled back.
      - --update-secrets=ALTEGIO_PARTNER_TOKEN=${_ALTEGIO_PARTNER_SECRET}:1,ALTEGIO_USER_TOKEN=${_ALTEGIO_USER_SECRET}:1,ALTEGIO_WEBHOOK_SECRET=altegio-native-webhook-token:1,TELEGRAM_ACCOUNT_CREDENTIALS_JSON=telegram-studio-notifications-credentials:1,SMSGATE_CREDENTIALS_JSON=smsgate-work-phone-credentials:1
      # Public studio facts verified against motionconcept.rest; preserve every
      # unrelated runtime variable and all Secret Manager bindings.
      # Only the styled English utility template is approved at this release.
      # Preserve the form's request activation time: never enroll older bookings.
      - "--update-env-vars=^|^BUILD_VERSION=$SHORT_SHA|OPENAI_MODEL=gpt-6.1-sol|OPENAI_REASONING_EFFORT=high|OPENAI_MAX_OUTPUT_TOKENS=8192|NATIVE_NOTIFICATIONS_ENABLED=true|NATIVE_TELEGRAM_ACCOUNT_READY=true|NATIVE_BOOKING_PERMISSION_SINCE=2026-10-05T19:21:45Z|NATIVE_NOTIFICATION_LANGUAGE=hy|NATIVE_WHATSAPP_READY=true|NATIVE_SMS_READY=true|NATIVE_SMS_PERMISSION_SINCE=2026-10-06T09:40:06Z|WHATSAPP_BOOKING_TEMPLATES_JSON={\"booking_created:en\":\"emotion_booking_update\",\"booking_changed:en\":\"emotion_booking_update\",\"booking_cancelled:en\":\"emotion_booking_update\"}|NATIVE_NOTIFICATIONS_ACTIVATED_AT=2026-10-05T17:35:00Z|BUSINESS_ADDRESS_EN=Myasnikyan 1/6, Yerevan|BUSINESS_ADDRESS_RU=Мясникян 1/6, Ереван|BUSINESS_ADDRESS_HY=Մյասնիկյան 1/6, Երևան|BUSINESS_PHONE=+37494768067|BUSINESS_WEBSITE_URL=https://www.motionconcept.rest/|BUSINESS_BOOKING_URL=https://book.altegio.me/company/1389810/|BUSINESS_INSTAGRAM_URL=https://www.instagram.com/e.motion.concept/|BUSINESS_FACEBOOK_URL=https://www.facebook.com/profile.php?id=61593274220346|BUSINESS_TELEGRAM_URL=https://t.me/emotion_concept_bot|BUSINESS_WHATSAPP_URL=https://wa.me/37494768067|BUSINESS_TIKTOK_URL=https://www.tiktok.com/@emotion.concept|BUSINESS_YOUTUBE_URL=https://www.youtube.com/@emotion.concept|BUSINESS_MAP_URL=https://maps.app.goo.gl/oSW4ZYFcf66H75Wa9|BUSINESS_YANDEX_MAP_URL=https://yandex.com/maps/-/CXezAUML"
      - --quiet

  - id: verify-candidate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -ceu
      - |
        tag="candidate-$SHORT_SHA"
        gcloud run services describe "${_SERVICE}" \
          --region "${_REGION}" \
          --format=json > /tmp/service.json
        candidate_url="$$(python3 -c 'import json, sys; tag=sys.argv[1]; print(next(item["url"] for item in json.load(sys.stdin)["status"]["traffic"] if item.get("tag") == tag))' "$$tag" < /tmp/service.json)"
        response="$$(curl -fsS --retry 10 --retry-delay 2 --retry-all-errors "$$candidate_url/health")"
        echo "$$response"
        echo "$$response" | grep -Fq '"status":"ok"'
        echo "$$response" | grep -Fq '"version":"$SHORT_SHA"'

  - id: promote-candidate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -ceu
      - |
        tag="candidate-$SHORT_SHA"
        gcloud run services update-traffic "${_SERVICE}" \
          --region "${_REGION}" \
          --to-tags "$$tag=100" \
          --quiet
        gcloud run services update-traffic "${_SERVICE}" \
          --region "${_REGION}" \
          --remove-tags "$$tag" \
          --quiet

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1200s
