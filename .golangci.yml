version: "2"

linters:
  # The default set is errcheck, govet, ineffassign, staticcheck and unused.
  enable:
    - bodyclose # an unclosed response body leaks a connection
    - errorlint # catches == on errors, which breaks once anything wraps them
    - gosec
    - misspell
    - noctx # every outbound HTTP request must carry a context
    - unconvert
    - usetesting
    - wastedassign

  exclusions:
    rules:
      # Test code deliberately builds odd inputs and ignores errors that
      # production code must not.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
